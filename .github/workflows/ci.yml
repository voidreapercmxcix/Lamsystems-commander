name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Byte-compile
        run: python -m py_compile src/lamsystems_commander/*.py
      - name: Pre-filter test harness
        run: python test_prefilter.py
      - name: Import + tool registration smoke check
        run: python check_import.py
