[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lamsystems-commander"
version = "0.1.0"
description = "Safety-first local MCP server: strict-allowlist shell, files, search, processes and git with human-in-the-loop gating. A self-hosted Desktop Commander alternative."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "James (LamSystems)" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Shells",
]
keywords = ["mcp", "claude", "terminal", "shell", "sudo", "allowlist", "desktop-commander"]

dependencies = [
    "mcp<2",
    "pydantic>=2.5",
    "rank-bm25>=0.2.2",
]

[project.urls]
Homepage = "https://github.com/Voidreaper2026/Lamsystems-commander"
Repository = "https://github.com/Voidreaper2026/Lamsystems-commander"
Issues = "https://github.com/Voidreaper2026/Lamsystems-commander/issues"
Changelog = "https://github.com/Voidreaper2026/Lamsystems-commander/blob/main/CHANGELOG.md"

[project.scripts]
lamsystems-commander = "lamsystems_commander.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lamsystems_commander = ["py.typed"]
